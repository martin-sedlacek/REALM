# RobotDefinition for the YAM bimanual workstation with I2RT's "crankshaft" gripper, from the ABC project's
# MuJoCo model (https://abc.bot, assets/put_bottles/assets/i2rt_yam/yam.xml). Every name and number is
# pinned against realm/robots/yam.py::YamCrankBimanualRobot by tests/test_yam_robot.py -- change them there.
#
# Same layout as yam_bimanual (two arms 0.62 m apart on a geometry-free root base_link at their midpoint,
# YAMLab's gate as the visual-only `frame` link, top camera as REALM's external_sensor0) over the single-arm
# yam_crank.usd: YAMLab's six arm links with ABC's gripper housing, crank fingers, wrist D405 bracket and TCP
# (scripts/build_yam_crank_usd.py). No camera_mount link: ABC hangs the D405 body straight off link_6.
# Finger sign is INVERTED relative to yam_bimanual: 0 = closed, +0.0475 (left) / -0.0475 (right) = open.

raw_controller_order: ["arm_left", "gripper_left", "arm_right", "gripper_right"]
default_controllers:
  arm_left: JointController
  gripper_left: MultiFingerGripperController
  arm_right: JointController
  gripper_right: MultiFingerGripperController

usd_path: "/app/realm/robots/yam/yam_crank_bimanual.usd"

# Arms collide with each other, never with themselves (every within-arm pair filtered; see yam_bimanual).
self_collisions: true
disabled_collision_pairs:
  - ["left_base_link", "left_link_1"]
  - ["left_base_link", "left_link_2"]
  - ["left_base_link", "left_link_3"]
