# RobotDefinition for the YAM bimanual workstation: two YAM arms on a shared mount, ported from
# YAMLab (https://github.com/ARISE-Initiative/yamlab). Every name and number is pinned against
# realm/robots/yam.py::YamBimanualRobot by tests/test_yam_robot.py -- change them there first.
#
# The USD is two copies of the single-arm asset composed by scripts/build_yam_bimanual_usd.py (links and
# joints prefixed left_/right_, arms 0.61 m apart in y, geometry-free root base_link at the midpoint).
# Controller order = YAMLab's 14-D action [left_arm(6), left_gripper(1), right_arm(6), right_gripper(1)].
# The top camera is not on the robot: realm/config/robots/YAM_bimanual.yaml places external_sensor0.

raw_controller_order: ["arm_left", "gripper_left", "arm_right", "gripper_right"]
default_controllers:
  arm_left: JointController
  gripper_left: MultiFingerGripperController
  arm_right: JointController
  gripper_right: MultiFingerGripperController

usd_path: "/app/realm/robots/yam/yam_bimanual.usd"

# YAMLab loads each arm as its own articulation with enabled_self_collisions=False: an arm never collides
# with itself, but the two arms DO collide with each other. Both arms are one articulation here, so self
# collisions are ON and every within-arm pair is filtered (YamBimanualRobot.disabled_collision_pairs()).
self_collisions: true
disabled_collision_pairs:
  - ["left_base_link", "left_link_1"]
