# YAM_molmoact2_rest_pose with the arms STARTING in MolmoAct2's mid-episode working pose (median episode-mean state
# over 66 episodes: L -0.11 0.76 0.68 -0.62 0.04 -0.20, R 0.33 1.27 1.15 -0.82 0.0 0.30 -- arms out over the table,
# wrist cameras looking down at it) instead of the episode-start rest pose. Diagnostic (2026-09-06): at rest the
# pi05 policy emits a 'go' chunk only ~1 in 10 times in REALM and never sustains it; from a working pose the
# offline replay shows it tracks and continues motion. Everything else as YAM_molmoact2_rest_pose.yaml.
# YAM bimanual workstation configured to look like the MolmoAct2-BimanualYAM recording rig (AllenAI), for the
# robocurve/pi05-yam-molmoact2 policy (--model_type openpi_yam). Identical to YAM_bimanual.yaml (same robot,
# same gains, same start pose) except the two camera keys below, picked by eye against dataset frames with
# scripts/yam_camera_sweep.py (jobs 204838/204845, 2026-09-06):
#   * exterior_camera: top camera 0.30 m ahead of the arm bases, 1.26 m above them, looking straight down,
#     focal 15 mm (~70 deg hfov). (The sweep composed the pose with the spawn position that already includes the
#     mount height, so its "z 0.40" candidates rendered from 0.40 + 0.864 m; job 204846 at a true 0.40 m saw only
#     a 0.6 m patch of table with no arms. 1.264 reproduces the view that was picked.) -- the dataset's top view has both arm bases at the bottom corners and the
#     table filling the frame; YAMLab's camera (0.17 m behind, 0.94 m up, 60 deg) sees the whole room.
#   * wrist_camera_pose: YAMLab's calibrated D405 pose (~25 deg below the flange axis). The USD carries ABC's 50 deg
#     bracket; closed-loop A/B on put_green_block_into_bowl (2026-09-06, physical grasps, 3 repeats each): 50 deg 0/3,
#     37 deg (slerp 0.5) 0/6, **25 deg 3/3** -- the policy's hand-eye calibration is YAMLab's.
# The robot name stays YAM_bimanual (obs profile); the file name is the --robot selector.
robots:
  - name: "YAM_bimanual"
    model: "yam_bimanual"
    dof: 16
    # Bare arms on a geometry-free mount frame: no column in the asset.
    has_base_column: false
    # REALM-only: height of the mount frame (the arm-base midpoint) above the scene's robot spawn point.
    # Same as the single arm, so the exterior-camera extrinsics and workspace match the DROID setup.
    mount_height: 0.863891
    # REALM-only: rigid offset from the DROID spawn pose in the robot's own frame (forward, left, up in
    # metres; yaw about the robot's z). The YAM reaches ~0.6 m, far less than the Franka, so it sits
    # 0.30 m closer to the workspace (chosen in the GUI, 2026-09-05). Cameras and
    # EE transforms expressed in the robot frame move with it; the objects do not. See YamRobot.SPAWN_OFFSET_POS.
    spawn_offset:
      pos: [0.30, 0.0, 0.0]
      yaw_deg: 0.0
    # Full-DOF reset pose in OmniGibson DOF order (breadth-first: left_joint1, right_joint1, ..., right_joint6,
    # then left fingers, then right fingers; fingers -0.0475 m = open). YAMLab's initial state for both arms.
    # YamBimanualRobot.default_joint_pos(): MolmoAct2's episode start pose per arm, in PhysX DOF order
    # (left_joint1, right_joint1, left_joint2, ...), then the four fingers open.
    reset_joint_pos: [-0.11, 0.33, 0.76, 1.27, 0.68, 1.15, -0.62, -0.82, 0.04, 0.0, -0.2, 0.3,
                      -0.0475, -0.0475, -0.0475, -0.0475]
    # Substring filter: matches left_link_6/wrist_camera AND right_link_6/wrist_camera.
    include_sensor_names: ["wrist_camera"]
    obs_modalities: ["rgb", "proprio"]
    proprio_obs: ["joint_qpos"]
    # YAMLab: 120 Hz physics, decimation 4 (sim_config.set_sim_config, robots named "YAM*").
    control_freq: 30
    action_normalize: False
    action_type: "continuous"
    controller_name: "JointController"
    controller_config:
        arm_left:
            name: "JointController"
            motor_type: "position"
            control_freq: 30
            use_delta_commands: False
            use_impedances: False
            command_input_limits: null
            command_output_limits: null
            # high_pd: shoulder joint1-3 + elbow joint4 = 800/50, wrist joint5-6 = 30/5.
            isaac_kp: [160.0, 160.0, 160.0, 160.0, 160.0, 160.0]
            isaac_kd: [20.0, 20.0, 20.0, 20.0, 20.0, 20.0]
        gripper_left:
          name: "MultiFingerGripperController"
          mode: "binary"
          motor_type: "position"
          # The stock binary controller drives "open" to the joints' UPPER limit and "close" to the LOWER
          # one; on the YAM fingers the upper limit (0.0) is CLOSED and the lower (-0.0475) is OPEN, so the
          # limits must be named explicitly or every command is inverted (measured in-container 2026-09-05:
          # a close command left the fingers at -0.0475). Order: [left_finger, right_finger].
          open_qpos: [-0.0475, -0.0475]
          closed_qpos: [0.0, 0.0]
          isaac_kp: 2000.0
          isaac_kd: 100.0
        arm_right:
            name: "JointController"
            motor_type: "position"
            control_freq: 30
            use_delta_commands: False
            use_impedances: False
            command_input_limits: null
            command_output_limits: null
            isaac_kp: [160.0, 160.0, 160.0, 160.0, 160.0, 160.0]
            isaac_kd: [20.0, 20.0, 20.0, 20.0, 20.0, 20.0]
        gripper_right:
          name: "MultiFingerGripperController"
          mode: "binary"
          motor_type: "position"
          # The stock binary controller drives "open" to the joints' UPPER limit and "close" to the LOWER
          # one; on the YAM fingers the upper limit (0.0) is CLOSED and the lower (-0.0475) is OPEN, so the
          # limits must be named explicitly or every command is inverted (measured in-container 2026-09-05:
          # a close command left the fingers at -0.0475). Order: [left_finger, right_finger].
          open_qpos: [-0.0475, -0.0475]
          closed_qpos: [0.0, 0.0]
          isaac_kp: 2000.0
          isaac_kd: 100.0
    sensor_config:
      VisionSensor:
        sensor_kwargs:
          # 4:3 like the D405 calibration and YAMLab's/ABC's own renders (a 16:9 frame letterboxed into a
          # square policy input comes out ~25% smaller than the training frames).
          image_height: 720
          image_width: 960
          # Both wrist cameras share the D405 calibration (fx = 390.666 at 640 px -> 78.6 deg hfov).
          focal_length: 12.7913
          horizontal_aperture: 20.955
          clipping_range: [0.04, 10000000.0]
    # REALM-only: YAMLab's fixed top camera (configs/robot/yam.yaml cameras.top), expressed in the mount
    # frame like every camera_extrinsics entry (xyz + xyzw quaternion, USD camera looks down -Z).
    # env_config places external_sensor0 here instead of the task's cam1 extrinsics, and sets its focal
    # length to the calibrated 78.4 deg horizontal FOV (fx = 392.196 at 640 px). The second exterior view
    # (--multi-view) keeps the task/default logic. See YamBimanualRobot.exterior_camera().
    exterior_camera:
      cam1:
        pos: [0.30, -0.009, 1.264]
        rot: [-0.000002, 0.000002, -0.707107, 0.707107]
      focal_length: 15.0
    # REALM-only (env_config -> scene_setup.place_wrist_cameras): both wrist cameras' local pose in link_6.
    wrist_camera_pose:
      pos: [-0.0004, 0.069638, 0.073063]
      quat_wxyz: [-0.003227, 0.002817, 0.975619, 0.219430]
