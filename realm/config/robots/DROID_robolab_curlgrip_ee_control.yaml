# Curl-grip robot config: droid_robolab_v2 with a SOFTER four-bar mimic constraint
# (naturalFrequency 200 instead of 1000 on the four inner mimic joints), so an open fingertip
# loaded by contact rotates INWARD.
#
# The ONLY difference from DROID_robolab_v2.yaml is `model:`. The gripper controller, its mode, the
# arm_0 block, `friction` and `armature` are all byte-identical -- verified, not assumed; see
# scripts/debug_probes/ship_arm_identity.py.
#
# DROID_robolab_v2 under END-EFFECTOR control (dm_robotics IK), rather than joint-position control.
#
# Same robot as DROID_robolab_v2.yaml -- same USD, same gripper, same cameras -- with the arm
# controller swapped for DroidEndEffectorController. Diff the two files to see exactly that and
# nothing else.
#
# `name` is deliberately "DROID_robolab_v2", NOT the filename. Configs are selected by FILENAME
# (env_config.py loads robots/<--robot>.yaml) but observations are keyed by the robot's `name`, and
# realm/inference/utils.py's ROBOT_OBS_PROFILES is looked up by that same name -- with a silent
# fallback to the stock DROID profile for anything unknown, which would hand the policy a
# non-existent wrist-camera key and the prismatic gripper normalisation. Keeping the name means the
# v2 profile resolves; assert_wrist_camera() fails the build if it ever does not.
robots:
  - name: "DROID_robolab_v2"
    model: "droid_robolab_curlgrip"
    # 7 arm + 6 gripper DOFs (finger_joint + 5 mimic followers), vs 11 for the stock DROID asset.
    dof: 13
    # The robolab asset is the bare arm: panda_link0 sits at z=0, whereas droid_mounted.usd includes
    # the base column and puts panda_link0 at z=0.8629. On a REALM_DROID10 task the scene position is
    # the *bottom of the column*, so spawning this asset there buries the arm in the table and the
    # contact forces NaN the sim within a few steps. env_dynamic raises the spawn point by
    # DROID_BASE_HEIGHT when this is false, which lands the arm origin exactly where the mounted
    # variant's would be -- so all the robot<->world frame maths stays unchanged.
    has_base_column: false
    obs_modalities: ["rgb", "proprio"]
    proprio_obs: ["joint_qpos"]
    # Drop the dead second wrist camera, exactly as DROID_robolab.yaml does -- read the long comment
    # there for why it is an include and not an exclude, and why the camera index in
    # ROBOT_OBS_PROFILES has to move with it. v2 comes out of the same converter
    # (scripts/convert_robolab_gripper_usd.py) as v1 and is described as differing only in geometry,
    # so it is ASSUMED to name its cameras the same way; that assumption is not silent, because
    # assert_wrist_camera() hard-fails at build time if this filter leaves the robot without the
    # `wrist_camera_flipped` prim its profile names.
    include_sensor_names: ["wrist_camera_flipped"]
    control_freq: 15
    action_normalize: False
    action_type: "continuous"
    friction: [ 0.05, 0.10, 0.05, 0.10, 0.75, 0.425, 0.20 ]
    armature: [ 0.25, 0.50, 0.25, 0.50, 0.25, 0.150, 0.00 ]
    # END-EFFECTOR CONTROL. Identical to DROID_ee_control.yaml's arm block; only the robot it drives
    # differs. That works because the IK is NOT solved against the robot's USD -- robot_ik/arm.py
    # loads a MuJoCo MJCF Franka (`franka/panda.xml`) and dm_robotics' cartesian_6d_velocity_effector
    # solves on that, then the resulting joint targets are applied to whichever OmniGibson robot is
    # loaded. The robolab asset is the same 7-DOF Franka arm as droid.usd (see
    # realm/robots/definitions/droid_robolab_v2/droid_robolab_v2.yaml: "Same arm as `droid`,
    # different gripper physics"), so the IK model matches and only the gripper differs -- and the
    # gripper is not part of the IK chain.
    ee_control: true
    controller_name: "DroidEndEffectorController"
    controller_config:
        arm_0:
            name: "DroidEndEffectorController"
            mode: "absolute_pose"
            motor_type: "position"
            # THE ONE LINE THAT MUST NOT BE COPIED FROM DROID_ee_control.yaml.
            #
            # droid_ee_controller.py defaults height_offset to 0.87 and adds it to the commanded z
            # before comparing against the eef pose RELATIVE TO THE ROBOT PRIM. That constant is the
            # height of the arm base above the robot prim, which is a property of the ASSET:
            #     droid_mounted.usd    panda_link0 at z = 0.86444 above /panda  -> 0.87 is right
            #     droid_robolab_v2.usd panda_link0 at z = 0.00000 above /panda  -> 0.87 is 0.87 m of error
            # The robolab asset is the bare arm (has_base_column: false), and env_config raises the
            # SPAWN by DROID_BASE_HEIGHT instead, so the robot prim already sits AT the arm base --
            # the same origin env._world2robot() uses to express the command. The offset must be 0.
            #
            # Measured on l40s-01 (job 190727), task 0, debug policy, 8 steps:
            #     height_offset 0.87 -> controller targets z=1.4425 in the arm-base frame; the arm's
            #                           maximum wrist reach is 1.187, so it stretches upward and the
            #                           error goes 0.904 -> 0.711 m and keeps climbing.
            #     height_offset 0.0  -> error goes 0.090 -> 0.005 m (converges).
            # NOTE this failure is INVISIBLE to tests/test_vector_integrity.py, which passed the
            # 0.87 version: nothing crashes, all four artifacts are written, the arm is just in
            # completely the wrong place.
            height_offset: 0.0
            control_freq: 15
            use_delta_commands: False
            use_impedances: True
            # Both left as real booleans and both False, matching DROID_ee_control.yaml. NOTE this
            # differs from the joint-control robolab configs, where use_cc_compensation is the
            # truthy STRING "False," and has therefore been ON for every historical REALM result.
            # Do not "harmonise" these without a measurement: it is a control hyperparameter.
            use_gravity_compensation: False
            use_cc_compensation: False
            Kq: [ 40, 30, 50, 35, 35, 25, 10 ]
            Kqd: [ 4, 6, 5, 5, 3, 2, 1 ]
            Kx: [ 400, 400, 400, 15, 15, 15 ]
            Kxd: [ 37, 37, 37, 2, 2, 2 ]
            command_output_limits: null
            command_input_limits: null
            max_effort: [ 87.0, 87.0, 87.0, 87.0, 12.0, 12.0, 12.0 ]
            min_effort: [ -87.0, -87.0, -87.0, -87.0, -12.0, -12.0, -12.0 ]
        gripper_0:
          name: "CustomGripperController"
          mode: "binary"
          # No open_qpos/closed_qpos override: finger_joint follows the standard Robotiq 2F-85
          # convention -- 0 rad = OPEN, 0.7854 rad = CLOSED -- which is already what
          # MultiFingerGripperController assumes (droid_gripper_controller.py:49-60 sends the
          # target>=0 branch, i.e. REALM's CLOSE, to the joint's UPPER limit).
          #
          # Measured 2026-08-11 on l40s-02 (job 189066), pad separation between the re-origined
          # left/right_inner_finger links, which sit on the pad centroids:
          #     finger_joint 0.0    -> 116.2 mm  (jaws wide open, ~85 mm gap plus pad thickness)
          #     finger_joint 0.7854 ->  33.0 mm  (jaws shut)
          #
          # WARNING, this is what makes the joint easy to get backwards: the gripper is a four-bar
          # linkage, so the KNUCKLES swing apart as the PADS close. Measuring "pad separation"
          # between anything other than the pads themselves reports the opposite of the truth. An
          # override added on 2026-08-11 from exactly that mistake inverted the gripper for a full
          # batch (og391_gravfix_robolab) before the videos showed the jaws clamped shut throughout.
          # Only trust a separation measured between the two inner_finger links AFTER
          # scripts/fix_robolab_link_origins.py has put their origins on the pads.
    sensor_config:
      VisionSensor:
        sensor_kwargs:
          image_height: 720
          image_width: 1280
          focal_length: 2.8
          # As in DROID.yaml: OG >= 3.9.1 writes horizontalAperture at init (default 20.995) instead
          # of honouring the camera prim, which would widen the wrist view to ~150 deg. The robolab
          # cameras author the same 5.376 x 3.024 sensor as droid.usd.
          horizontal_aperture: 5.376
