# GENERATED SWEEP RUNG -- pad spring kp/kd only. Base: DROID_robolab_padspring.yaml.
# Kept as a separate config file so each rung's probe artifacts get distinct filenames.
# DROID with the "pad spring" robolab Franka + Robotiq 2F-85 asset.
#
# Identical to DROID_robolab_v2.yaml -- same arm, same arm controller, same gains -- except that the
# gripper's two inner-finger pivots are sprung followers instead of PhysX mimic joints, so the pads
# can visibly rotate when loaded. The three moving parts of that change:
#
#   realm/robots/panda_robotiq/droid_robolab_padspring.usd        mimic removed, DriveAPI added
#   realm/robots/definitions/droid_robolab_padspring/             finger_joint_names + controller
#   realm/robots/padspring_gripper_controller.py                  pad target = gearing*q_leader
#
# `name` stays "DROID_robolab_v2" ON PURPOSE: realm/inference/utils.py ROBOT_OBS_PROFILES and
# assert_wrist_camera() key on the robot's name, and this variant's observation layout is unchanged.
# The CONFIG name (this file's stem) is what selects it: --robot DROID_robolab_padspring.
#
# UNSIGNED-OFF: the pad spring values below change grasp behaviour on every task. Measured evidence
# is in ~/runbook/streams/realm_og391_port.md; the numbers are not adopted until Martin says so.

robots:
  - name: "DROID_robolab_v2"
    model: "droid_robolab_padspring"
    # 7 arm + 6 gripper DOFs (finger_joint + 5 mimic followers), vs 11 for the stock DROID asset.
    dof: 13
    # The robolab asset is the bare arm: panda_link0 sits at z=0, whereas droid_mounted.usd includes
    # the base column and puts panda_link0 at z=0.8629. On a REALM_DROID10 task the scene position is
    # the *bottom of the column*, so spawning this asset there buries the arm in the table and the
    # contact forces NaN the sim within a few steps. env_dynamic raises the spawn point by
    # DROID_BASE_HEIGHT when this is false, which lands the arm origin exactly where the mounted
    # variant's would be -- so all the robot<->world frame maths stays unchanged.
    has_base_column: false
    obs_modalities: ["rgb", "proprio"]
    proprio_obs: ["joint_qpos"]
    # Drop the dead second wrist camera, exactly as DROID_robolab.yaml does -- read the long comment
    # there for why it is an include and not an exclude, and why the camera index in
    # ROBOT_OBS_PROFILES has to move with it. v2 comes out of the same converter
    # (scripts/convert_robolab_gripper_usd.py) as v1 and is described as differing only in geometry,
    # so it is ASSUMED to name its cameras the same way; that assumption is not silent, because
    # assert_wrist_camera() hard-fails at build time if this filter leaves the robot without the
    # `wrist_camera_flipped` prim its profile names.
    include_sensor_names: ["wrist_camera_flipped"]
    control_freq: 15
    action_normalize: False
    action_type: "continuous"
    friction: [ 0.05, 0.10, 0.05, 0.10, 0.75, 0.425, 0.20 ]
    armature: [ 0.25, 0.50, 0.25, 0.50, 0.25, 0.150, 0.00 ]
    controller_name: "CustomJointController"
    controller_config:
        arm_0:
            name: "CustomJointController"
            "motor_type": "position"
            control_freq: 15
            use_delta_commands: False
            use_impedances: True
            # REGRESSION FIX (2026-08-11): this said `False,` -- with a trailing comma, which YAML
            # parses as the STRING "False," and bool("False,") is True. Harmless while the flag was
            # ignored; dc7b6f8 implemented it in droid_joint_controller.py:176-213, which silently
            # turned gravity compensation ON for every DROID variant. Measured on the stock asset:
            # ON -> task_progression 0.000 with ee_z pinned at 1.493 (the arm never descends);
            # OFF -> the arm reaches the block, ee_z_min 0.970. Keep this a real boolean.
            use_gravity_compensation: false
            # NOT corrected on purpose. The same trailing-comma typo makes this the truthy string
            # "False,", so Coriolis/centrifugal compensation is effectively ON -- and has been for
            # EVERY historical REALM result, including the 1.1.1 SR 0.88-1.00 runs and og391's
            # SR 0.40 (job 187497); unlike gravity comp, cc was already applied pre-3.9.1. Making it
            # a real `false` would change a control hyperparameter relative to every validated run.
            # Measured indistinguishable from ON at n=1 (task_progression 0.200 either way). Needs a
            # human decision, not a silent flip.
            # NOTE: this reads `true`, and that is not a change in behaviour. It was written
            # `False,` -- with a trailing comma, which YAML parses as the *string* "False,",
            # which is truthy -- so Coriolis/centrifugal compensation has in fact been ON for
            # every REALM result, including the 1.1.1 runs. (The controllers also default it
            # to True.) Written explicitly so the file says what it does; flipping it to a
            # real `false` would be a control-hyperparameter change, not a bug fix.
            use_cc_compensation: true
            Kq: [ 40, 30, 50, 35, 35, 25, 10 ]
            Kqd: [ 4, 6, 5, 5, 3, 2, 1 ]
            Kx: [ 400, 400, 400, 15, 15, 15 ]
            Kxd: [ 37, 37, 37, 2, 2, 2 ]
            command_output_limits: null
            command_input_limits: null
            max_effort: [ 87.0, 87.0, 87.0, 87.0, 12.0, 12.0, 12.0 ]
            min_effort: [ -87.0, -87.0, -87.0, -87.0, -12.0, -12.0, -12.0 ]
        gripper_0:
          # Three DOFs, not one: finger_joint plus the two sprung pad pivots. See
          # realm/robots/padspring_gripper_controller.py and the definition's finger_joint_names.
          name: "PadSpringGripperController"
          mode: "binary"
          # The affine relation the removed PhysxMimicJointAPI enforced, read off
          # droid_robolab_v2.usd: physxMimicJoint:rotX:gearing = +1.0 on left_inner_finger_joint and
          # -1.0 on right_inner_finger_joint, offset 0 on both. Order matches finger_joint_names[1:].
                    # SIGN MEASURED, NOT READ OFF THE USD (2026-08-14). droid_robolab_v2.usd authors
          # physxMimicJoint:rotX:gearing = +1.0 on left_inner_finger_joint and -1.0 on the right, but
          # the SHUT pose the constraint actually produces in REALM is left = -0.7854, right = +0.7854
          # (read off the default asset's own proprio: gq[2:4] = [-0.7854, +0.7854] with finger_joint
          # at +0.7854). PhysX's gearing sign convention is therefore inverted relative to
          # q_follower = gearing*q_leader. Taking the authored sign at face value put the pads 90 deg
          # out: the shut pad-origin separation read 7.29 mm instead of the default's 33.0 mm, which
          # is the check to run after any change here.
          pad_gearing: [-1.0, 1.0]
          pad_offset: [0.0, 0.0]
          # ---- THE SPRING. Physics hyperparameters; Martin's call. ----------------------------
          # Per-DOF, in finger_joint_names order. Isaac gains are per RADIAN.
          #   [0] finger_joint: OmniGibson's own defaults (controller_base m.DEFAULT_ISAAC_KP/KD),
          #       written out explicitly so adding the pad entries does not silently change the
          #       leader. Do not tune this here -- the leader saturates at maxForce 16.5 N.m anyway.
          #   [1],[2] pad pivots: low stiffness = visible pad rotation under load. Deflection at
          #       equilibrium is (pad contact torque) / kp, and the pad contact torque at a hard
          #       stall is of order (pad force ~40-55 N) x (pivot-to-pad-face arm ~0.02 m) ~ 1 N.m,
          #       so kp = 10 gives ~0.1 rad = ~6 deg of pad rotation. The cap on how much torque the
          #       spring can supply before the pad simply folds is drive:angular:physics:maxForce in
          #       droid_robolab_padspring.usd (--max-effort of the build command), NOT settable here.
          isaac_kp: [1.0e7, 150.0, 150.0]
          isaac_kd: [1.0e5, 12.0, 12.0]
          # No open_qpos/closed_qpos: finger_joint keeps the standard 2F-85 convention (0 rad = OPEN,
          # 0.7854 rad = CLOSED) that the controller's binary branch assumes, and the pad targets are
          # derived from the leader's rather than from a limit.
    sensor_config:
      VisionSensor:
        sensor_kwargs:
          image_height: 720
          image_width: 1280
          focal_length: 2.8
          # As in DROID.yaml: OG >= 3.9.1 writes horizontalAperture at init (default 20.995) instead
          # of honouring the camera prim, which would widen the wrist view to ~150 deg. The robolab
          # cameras author the same 5.376 x 3.024 sensor as droid.usd.
          horizontal_aperture: 5.376
