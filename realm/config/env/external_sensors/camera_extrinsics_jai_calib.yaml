# Every external-camera pose scraped from /mnt/datasets/calib_dataset_jai/calib_datasets/.
# "External" = config.json ref_frame == base_frame, left camera only (cam12990599L is the
# wrist cam, ref_frame panda_end_effector_frame, and is excluded everywhere; *R stereo mates are
# never independently calibrated in this pipeline, only *L is bundle-adjusted).
#
# Sources, one pose per record (rot = xyzw quaternion, pos/rot both in the real robot base_frame):
#   *_ba / *_staged  -- from ba_results*.json in each *_calib_graphy / *_jointoffset dir: the
#                        bundle-adjusted (ba_4x4) and pre-BA initial-guess (staged_4x4) pose from
#                        one experiment variant (loss function / holdout / joint-offset-fix combo
#                        the calib_graphy team tried -- see the *_calib_graphy dirs' many
#                        ba_results_<tag>.json files). Different tags on the same session are
#                        the SAME physical rig re-solved differently, not different cameras.
#   solve_<group>    -- from solve_results.json: one raw per-board-group T_base_cam solve
#                        (transform == "T_base_cam" only; other transform kinds, e.g. the wrist
#                        cam's T_ee_cam, are skipped). Each group is a genuinely different
#                        calibration-board placement/observation.
#   vanilla_info /
#   vanilla_histN    -- from vanilla_droid_calib/{calibration_info.json,history.jsonl}: DROID's
#                        own calibration app snapshots (pos + rotvec, converted to xyzw quat here).
#
# This is a raw scrape, not a curated "best pose per camera" list -- entries from the same
# session/camera cluster tightly (they're repeated estimates of one real, fixed camera mount) and
# are kept unaveraged/unfiltered on purpose so this can serve as a pose-sampling pool (e.g. for
# view-perturbation randomization), the same role the ep_XXXXXX_camN entries play in
# camera_extrinsics.yaml. 2026-08-05_calib_graphy contributes only its handful of solve_results.json
# groups -- it never got a full ba_results run (session was abandoned after one board group).
#
# NOT cross-checked against REALM's sim robot-base convention/origin -- verify before using any
# single entry for a real eval; this file is intentionally exhaustive rather than vetted.


