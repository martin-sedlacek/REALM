# ==================================================================================================
# TIER 1 OF TWO. STATIC CHECKS. THIS WORKFLOW DOES NOT TEST THE SIMULATOR.
#
# Read this before reading a green run as reassurance.
#
# WHAT IS NOT COVERED HERE, AND WHERE IT RUNS INSTEAD:
#
#   * The entire simulation. No scene is loaded, no rollout is run, no observation is rendered, no
#     artifact is written. Nothing here constructs a REALM environment.
#   * Eleven of the suite's twelve entries -- test_integrity (10 tasks),
#     test_perturbations_integrity (16 perturbations), the four test_vector_integrity
#     configurations, test_single_task, test_scene_object_placement, test_pi0_integration.
#   * Reason: REALM does not run on CPU in any useful sense. The stack -- OmniGibson 3.9.1, Isaac
#     Sim 5.1, PyTorch -- lives in a ~13 GB Apptainer image published nowhere, and the BEHAVIOR-1K
#     dataset is ~36 GB behind the NVIDIA Omniverse EULA. A GitHub-HOSTED runner has neither, and
#     no NVIDIA device.
#   * Where they run: TIER 2, .github/workflows/gpu-suite.yml, on a SELF-HOSTED GPU runner --
#     which does not exist yet; see that file's header -- and by hand on Clara with
#     `ALLOC=<slurm jobid> make test-suite`.
#
# THERE IS DELIBERATELY NO BADGE FOR THIS WORKFLOW IN THE README. A "passing" badge on a repository
# whose simulation is entirely untested by that badge would be actively misleading, and this
# project has a documented history of that exact failure mode: a perturbation that passed every
# numeric check while being a no-op, and drawer tasks that pass today with scene 0's cabinet lying
# on its back. Coverage, honestly stated, is the wiki's "Test coverage" page. Read that, not a tick.
#
# WHAT IS COVERED, AND WHY IT EARNS ITS KEEP:
#
#   * The suite's own wiring still resolves. A documented invocation drifting away from the tree is
#     a failure this repo has a real history of; this is that check, automated.
#   * Every shell script under scripts/ parses. `rr`, `go`, `lib/paths.sh` and the sbatch launchers
#     are what every wiki page tells a reader to run.
#   * Every YAML under realm/config/ parses. A stray trailing comma there is a documented bug class
#     here: `use_cc_compensation: False,` parses as the truthy STRING "False,", which silently
#     enabled gravity compensation for every DROID variant once.
#   * The one genuinely container-free test, which found two real code defects in 0.06 s.
#
# Conventions follow upstream BEHAVIOR-1K (REALM is a fork): `continue-on-error` on the test step
# plus a gate on the JUnit XML rather than on the exit code, and per-job artifact upload.
# ==================================================================================================

name: static-checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks (no GPU, no container, no simulation)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # the container's version, so syntax gates match it

      # Neither is a REALM dependency being added.
      #   PyYAML is already imported at runtime by realm/categories.py,
      #   realm/environments/{utils,env_config,env_dynamic,scene_setup}.py and by the rubric test.
      #   ruff is a developer tool, pinned here the way upstream pins it in .pre-commit-config.yaml.
      # Nothing else is installed: there is deliberately no test framework, because there is no
      # pytest suite to run.
      - name: Install PyYAML (already a REALM runtime import) and ruff
        run: python -m pip install --disable-pip-version-check --quiet pyyaml 'ruff==0.16.3'

      - name: Byte-compile every Python file
        run: python -m compileall -q examples realm scripts tests

      - name: Shell syntax check on the harness
        run: |
          set -e
          find scripts -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          bash -n scripts/clara/interactive/rr
          bash -n scripts/clara/interactive/go

      - name: Every YAML under realm/config/ parses
        run: |
          python - <<'PY'
          import pathlib, sys, yaml
          bad = []
          files = sorted(pathlib.Path("realm/config").rglob("*.y*ml"))
          for f in files:
              try:
                  yaml.safe_load(f.read_text())
              except Exception as e:
                  bad.append(f"{f}: {type(e).__name__}: {e}")
          print(f"{len(files)} YAML files under realm/config/")
          for b in bad:
              print(f"FAIL: {b}", file=sys.stderr)
          sys.exit(1 if bad else 0)
          PY

      - name: Suite wiring still points at files that exist
        run: |
          python - <<'PY'
          import importlib.util, pathlib, sys

          spec = importlib.util.spec_from_file_location("run_suite", "tests/run_suite.py")
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)

          problems = []
          for name, s in m.SUITE.items():
              target = pathlib.Path(s["argv"][0])
              if not target.is_file():
                  problems.append(f"{name}: argv[0] {target} does not exist")
              for key in ("tier", "timeout", "verdict", "note"):
                  if key not in s:
                      problems.append(f"{name}: spec is missing {key!r}")
          if not pathlib.Path(m.RR).is_file():
              problems.append(f"RR does not exist: {m.RR}")

          # A level naming a test that no longer exists is how `make test-suite` silently stops
          # covering something. This is the check for that.
          for level, names in m.LEVELS.items():
              for n in names:
                  if n not in m.SUITE:
                      problems.append(f"LEVELS[{level!r}] names unknown test {n!r}")
          for n in m.OGLITE_SENSITIVE:
              if n not in m.SUITE:
                  problems.append(f"OGLITE_SENSITIVE names unknown test {n!r}")

          tiers = sorted({s["tier"] for s in m.SUITE.values()})
          print(f"{len(m.SUITE)} tests, tiers: {', '.join(tiers)}, levels: {', '.join(m.LEVELS)}")
          if "local" not in tiers:
              problems.append("no 'local' tier: nothing in the suite is container-free any more")

          for p in problems:
              print(f"FAIL: {p}", file=sys.stderr)
          sys.exit(1 if problems else 0)
          PY

      - name: Suite listing and Makefile targets resolve
        run: |
          set -e
          python3 tests/run_suite.py --list
          make test-list
          # The GPU targets must refuse without an allocation rather than silently running the
          # container tests on whatever host they landed on.
          for target in test-smoke test-suite test-matrix test-server; do
            if make $target 2>/dev/null; then
              echo "FAIL: 'make $target' succeeded with no ALLOC set; it must refuse." >&2
              exit 1
            fi
          done

      # ------------------------------------------------------------------------------------------
      # KNOWN RED, and non-blocking for that reason alone. .ruff.toml records the baseline: 25
      # F401/F811 findings, in realm/ (3), scripts/ (19) and tests/ (3). They are all --fix-able and
      # none is fixed here, because this change was scoped to docs, tests wiring, the Makefile and
      # CI. WHEN THEY ARE CLEARED, DELETE THE continue-on-error LINE.
      # ------------------------------------------------------------------------------------------
      - name: Lint (KNOWN RED -- baseline 25 findings, see .ruff.toml)
        id: lint
        continue-on-error: true
        run: make lint

      # ------------------------------------------------------------------------------------------
      # KNOWN RED, and non-blocking for that reason alone.
      # tests/test_task_progression_rubrics.py was committed red on purpose (6835628, "and it
      # FAILS, on two real code defects"): the `pour` rubric in
      # realm/config/tasks/task_progressions.yaml names a POUR stage that success_conditions has no
      # key for -- and get_task_progression() CALLS the None it gets back, so that is a TypeError
      # mid rollout, not a skipped stage -- and check_pour does not accept `obs`. Both are latent
      # today because no shipped task config declares `pour`.
      #
      # This is NOT continue-on-error to tolerate flakiness: the test is deterministic and takes
      # 0.06 s. It is non-blocking because the defects live in realm/ and fixing them is a code
      # change. WHEN THEY ARE FIXED, DELETE THE continue-on-error LINE -- this should become a
      # blocking gate, and a green run here is the signal that it can.
      # ------------------------------------------------------------------------------------------
      - name: Container-free tests (KNOWN RED -- 2 real defects in realm/, see comment above)
        id: static_tests
        continue-on-error: true
        run: make test-static

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.run_id }}-static-checks
          path: tmp/suite/results.xml
          if-no-files-found: warn

      # Upstream BEHAVIOR-1K's gate, verbatim in spirit: judge the ARTIFACT, not the exit code. A
      # missing XML is the crash signal -- run_suite.py writes it once, after the last test, so its
      # absence means the driver itself died. Kept non-blocking only because the run above is
      # known red; the logic is live and will gate correctly the moment that changes.
      - name: Check for failures, errors, or missing XML
        if: always()
        continue-on-error: true
        run: |
          if [ ! -f tmp/suite/results.xml ]; then
            echo "Error: XML file not found -- the driver died before finishing (segfault, OOM, kill)"
            exit 1
          elif grep -Eq 'failures="[1-9][0-9]*"|errors="[1-9][0-9]*"' tmp/suite/results.xml; then
            echo "Error: test failures or errors found"
            exit 1
          else
            echo "All container-free tests passed"
          fi

      - name: Summary
        if: always()
        run: |
          echo "lint:        ${{ steps.lint.outcome }}   (expected: failure, baseline 25 findings)"
          echo "test-static: ${{ steps.static_tests.outcome }}   (expected: failure, 2 POUR/check_pour defects)"
          echo
          echo "NOT CHECKED HERE: the simulator, and 11 of the suite's 12 entries."
          echo "No GPU, no container, no dataset, no scene, no rollout."
          echo "Tier 2 is .github/workflows/gpu-suite.yml / 'ALLOC=<jobid> make test-suite'."
          echo "Coverage, honestly stated: the wiki's Test coverage page."
