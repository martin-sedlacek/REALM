name: Static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install host-only tools
        run: uv sync --locked
      - name: Run lint
        run: uv run --locked ruff check realm examples tests scripts
      - name: Run container-free static tests
        if: ${{ !cancelled() }}
        run: uv run --locked python tests/run_suite.py --only local --strict --out tmp/suite/results.json --junit-xml tmp/suite/results.xml
      - name: Run host-safe pytest modules
        if: ${{ !cancelled() }}
        run: >-
          uv run --locked python -m pytest -q
          tests/test_perturbation_task_types.py
          tests/test_cell_classification.py
          tests/test_robot_base_column.py
          tests/test_robot_definition_parity.py
      - name: Upload static-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-test-junit
          path: tmp/suite/results.xml
          if-no-files-found: warn
