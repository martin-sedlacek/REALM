[project]
name = "robometer-client"
version = "0.1.0"
description = "HTTP client for a running Robometer (RBM) reward-model eval server; no robometer dependency"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.6",
    "requests>=2.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robometer_client"]

# No [tool.ruff] here on purpose: the repo's .ruff.toml (F401/F811) then governs this package too.
